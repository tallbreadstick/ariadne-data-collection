[package]
name = "ariadne-data-collection"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "HTTPS ingestion server for anonymous Ariadne session metrics"
license = "UNLICENSED"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
regex-lite = "0.1"
hex = "0.4"
http = "1.3"
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "json", "migrate", "uuid"] }
thiserror = "2.0"
tokio = { version = "1.44", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.16", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
